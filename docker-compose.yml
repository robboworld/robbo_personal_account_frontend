# ЛК frontend (SPA + Express).
# Preview-плеер проекта — внешний URL (RobboScratch build), см. SCRATCH_PLAYER_URL в .env.
name: robbo_personal_account_frontend

services:
  web:
    restart: unless-stopped
    build: .
    stdin_open: true
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - HOST=0.0.0.0
